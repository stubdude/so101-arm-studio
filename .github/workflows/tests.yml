name: Portable app tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  demo-and-api:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-demo.txt
      - run: python install.py
      - name: Test in the installed environment
        run: python -c "import os,subprocess; subprocess.run(['.venv/Scripts/python.exe' if os.name == 'nt' else '.venv/bin/python', '-m', 'unittest', 'discover', '-s', 'tests', '-v'], check=True)"
