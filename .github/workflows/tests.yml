name: Portable app tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  demo-and-api:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    env:
      ARM_STUDIO_DATA_DIR: ${{ runner.temp }}/arm-studio-ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-demo.txt
      - run: python -m pip install -r requirements-demo.txt
      - run: python -m unittest discover -s tests -v
